# =============================================================================
# ValaryRPG-Core - Configurazione principale
# Tutti i valori (permessi, comandi, delay, suoni) vivono qui: zero hardcoding.
# =============================================================================

plugin:
  prefix: "<gradient:#8B5CF6:#EC4899><bold>Valary</bold></gradient> <dark_gray>»"
  language: it

modules:
  worlds: true
  homes: true
  warps: true
  players: true
  moderation: true
  mechanics: true

commands:
  root: valary
  root-aliases:
    - vcore
    - core
  spawn: spawn
  spawn-aliases: []
  setspawn: setspawn
  setspawn-aliases: []
  weatherlock: weatherlock
  weatherlock-aliases:
    - wlock
  home: home
  home-aliases: []
  sethome: sethome
  sethome-aliases: []
  delhome: delhome
  delhome-aliases: []
  homes: homes
  homes-aliases: []
  warp: warp
  warp-aliases: []
  setwarp: setwarp
  setwarp-aliases: []
  delwarp: delwarp
  delwarp-aliases: []
  warps: warps
  warps-aliases: []
  msg: msg
  msg-aliases:
    - whisper
    - m
  reply: r
  reply-aliases:
    - reply
  socialspy: socialspy
  socialspy-aliases:
    - ss
  nick: nick
  nick-aliases:
    - nickname
  fly: fly
  fly-aliases: []
  kick: kick
  ban: ban
  banlist: banlist
  unban: unban
  unban-aliases: []
  ipban: ipban
  ipban-aliases: []
  mute: mute
  mute-aliases: []
  unmute: unmute
  unmute-aliases: []
  warn: warn
  warn-aliases: []
  warnings: warnings
  warnings-aliases: []
  dupeip: dupeip
  dupeip-aliases: []
  vanish: vanish
  vanish-aliases:
    - v
  vanishedit: vanishedit
  vanishedit-aliases: []
  invsee: invsee
  invsee-aliases:
    - inv
  limity: limity
  limity-aliases: []
  checkdeath: checkdeath
  checkdeath-aliases:
    - death
  copycoord: copycoord
  copycoord-aliases:
    - coords
    - getpos

permissions:
  admin: valary.admin
  reload: valary.reload
  spawn: valary.spawn
  spawn-others: valary.spawn.others
  setspawn: valary.setspawn
  weatherlock: valary.weather.lock
  home: valary.home
  sethome: valary.home.set
  delhome: valary.home.delete
  home-unlimited: valary.home.unlimited
  warp: valary.warp
  warp-others: valary.warp.others
  setwarp: valary.warp.set
  delwarp: valary.warp.delete
  msg: valary.msg
  socialspy: valary.socialspy
  nick: valary.nick
  nick-color: valary.nick.color
  nick-others: valary.nick.others
  fly: valary.fly
  fly-others: valary.fly.others
  kick: valary.kick
  ban: valary.ban
  banlist: valary.banlist
  unban: valary.unban
  ipban: valary.ipban
  mute: valary.mute
  unmute: valary.unmute
  warn: valary.warn
  warnings: valary.warnings
  dupeip: valary.dupeip
  vanish: valary.vanish
  vanish-others: valary.vanish.others
  vanish-see: valary.vanish.see
  vanishedit: valary.vanishedit
  invsee: valary.invsee
  limity: valary.limity
  limity-bypass: valary.limity.bypass
  checkdeath: valary.checkdeath
  checkdeath-others: valary.checkdeath.others
  copycoord: valary.copycoord
  copycoord-others: valary.copycoord.others

sounds:
  teleport-success: ENTITY_ENDERMAN_TELEPORT
  spawn-set: BLOCK_NOTE_BLOCK_PLING
  command-denied: ENTITY_VILLAGER_NO
  reload-success: ENTITY_PLAYER_LEVELUP
  msg-send: ENTITY_EXPERIENCE_ORB_PICKUP
  msg-receive: ENTITY_EXPERIENCE_ORB_PICKUP

delays:
  command-cooldown-millis: 250
