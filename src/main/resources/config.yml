# =============================================================================
# ValaryRPG-Core — config principale (moduli, comandi, permessi, HUD teleport)
# Testi: lang/messages.yml, lang/vanilla.yml   Suoni: sounds/sounds.yml   Moduli: modules/<nome>.yml
# Disattiva un modulo con false: non registra comandi/eventi.
# Permessi: cambia il nodo qui, non nel Java. Alias comandi: liste sotto commands.*
# =============================================================================

plugin:
  prefix: "<gradient:#8B5CF6:#EC4899><bold>Valary</bold></gradient> <dark_gray>»"
  language: it
  # Sostituisce i testi vanilla (give, gamemode, time, weather, tp, advancement…) con lang/vanilla.yml
  vanilla-messages: true

