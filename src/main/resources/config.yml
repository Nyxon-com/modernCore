# Countdown a schermo per warmup/cooldown di /home /warp /spawn
teleport:
  # true = dopo /spawn /home /warp / LimitY niente danno da caduta
  reset-fall: true
  fall-grace-millis: 1000
  hud:
    enabled: true
    # ACTION_BAR oppure TITLE
    type: ACTION_BAR
    interval-ticks: 20
    title-fade-in-ticks: 0
    title-stay-ticks: 25
    title-fade-out-ticks: 5

delays:
  command-cooldown-millis: 250
