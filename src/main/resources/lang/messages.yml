  dupeip-line: "<dark_gray>› <white>{player}    {status}"
  status-online: "<green>ONLINE"
  status-offline: "<dark_gray>OFF"
  status-banned: "<red><bold>BAN</bold>"
  status-ipban: "<red>IPBAN"
  status-muted: "<gold>MUTE"
  status-warns: "<white>warn <gold>x{count}"
  default-reason: Nessun motivo

