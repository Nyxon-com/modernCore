    - ""
  history-line: "<dark_gray>› {type}  {state}<newline>  <gray>motivo <white>{reason}<newline>  <dark_gray>staff <gray>{staff}  <dark_gray>il <gray>{when}  <dark_gray>durata <gray>{duration}"
  history-line-revoked: "<dark_gray>› {type}  {state}<newline>  <gray>motivo ban <white>{reason}<newline>  <dark_gray>staff <gray>{staff}  <dark_gray>il <gray>{when}  <dark_gray>durata <gray>{duration}<newline>  <gray>pardon <white>{revoke-reason}<newline>  <dark_gray>da <gray>{revoked-by}  <dark_gray>il <gray>{revoked-when}"
  history-line-expired: "<dark_gray>› {type}  {state}<newline>  <gray>motivo <white>{reason}<newline>  <dark_gray>staff <gray>{staff}  <dark_gray>il <gray>{when}  <dark_gray>durata <gray>{duration}"
  history-active: "<green><bold>ATTIVO</bold>"
  history-inactive: "<gray><bold>REVOCATO</bold>"
  history-expired: "<gold><bold>SCADUTO</bold>"
  history-permanent: "<red><bold>PERMANENTE</bold>"
  history-event: "<dark_gray>evento"
  history-type-KICK: "<yellow>KICK"
  history-type-BAN: "<red>BAN"
  history-type-IPBAN: "<red>IPBAN"
  history-type-MUTE: "<gold>MUTE"
  history-type-WARN: "<white>WARN"
  dupeip-usage: "{prefix} <gray>Uso: <white>/{label} <player|ip></white>"
  dupeip-missing: "{prefix} <red>Nessun IP noto per <white>{player}</white>."
  dupeip:
    - ""
