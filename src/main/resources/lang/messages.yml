  unlocked: "{prefix} <green>Meteo di <white>{world}</white> sbloccato."
  usage: "{prefix} <gray>Uso: <white>/{label} <clear|rain|thunder|unlock> [mondo]</white>"
  invalid-type: "{prefix} <red>Tipo meteo non valido. Usa: clear, rain, thunder, unlock."

time:
  locked: "{prefix} <green>Ora di <white>{world}</white> bloccata su <white>{time}</white> <gray>({ticks} tick)."
  unlocked: "{prefix} <green>Ciclo giorno/notte di <white>{world}</white> sbloccato."
  usage: "{prefix} <gray>Uso: <white>/{label} <day|noon|night|midnight|unlock> [mondo]</white>"
  invalid-type: "{prefix} <red>Tipo ora non valido. Usa: day, noon, night, midnight, unlock oppure un numero di tick."

falldamage:
  usage: "{prefix} <gray>Uso: <white>/{label} <true|false> [mondo]</white>  es. <white>/{label} false spawn</white>"
  enabled: "{prefix} <green>Danno da caduta attivo in <white>{world}</white>."
  disabled: "{prefix} <yellow>Danno da caduta disattivato in <white>{world}</white>."
  current-on: "{prefix} <gray>Danno da caduta in <white>{world}</white>: <green>attivo</green>."
  current-off: "{prefix} <gray>Danno da caduta in <white>{world}</white>: <yellow>disattivo</yellow>."

join-quit:
  join: "<dark_gray>[<green>+<dark_gray>] <gray>{displayname}"
  first-join: "<dark_gray>[<gold>+<dark_gray>] <yellow>{displayname} <gray>è entrato per la prima volta."
  quit: "<dark_gray>[<red>-<dark_gray>] <gray>{displayname}"

nick:
  current: "{prefix} <gray>Nickname attuale: {nick}"
  none: "{prefix} <gray>Non hai un nickname. Usa <white>/nick <nome></white>."
  set: "{prefix} <green>Nickname di <white>{player}</white> impostato a {nick}<green>."
  set-by-staff: "{prefix} <gray>{player} ti ha impostato il nickname {nick}<gray>."
  cleared: "{prefix} <green>Nickname di <white>{player}</white> rimosso."
  cleared-by-staff: "{prefix} <gray>{player} ti ha rimosso il nickname."
  invalid: "{prefix} <red>Nickname non valido."
  too-long: "{prefix} <red>Nickname troppo lungo (max {max} caratteri visibili)."
  blocked: "{prefix} <red>Questo nickname contiene parole non permesse."

msg:
  usage: "{prefix} <gray>Uso: <white>/{label} <player> <messaggio></white>"
  reply-usage: "{prefix} <gray>Uso: <white>/{label} <messaggio></white>"
  you: Tu
  me: Te
  to-sender: "<dark_gray>[<gradient:#E9D5FF:#C084FC>MSG</gradient>] <gray>a <white>{target}<dark_gray> » <white>{message}"
  to-target: "<dark_gray>[<gradient:#E9D5FF:#C084FC>MSG</gradient>] <gray>da <white>{player}<dark_gray> » <white>{message}"
  spy: "<dark_gray>[<gradient:#FBBF24:#F59E0B><bold>SS</bold></gradient>] <white>{player} <gold>→</gold> <aqua>{target} <dark_gray>»</dark_gray> <gray>{message}"
  spy-self-line: "<dark_gray>[<gradient:#FBBF24:#F59E0B><bold>SS</bold></gradient>] <white>{player} <gold>→</gold> <aqua>{target} <dark_gray>»</dark_gray> <gray>{message}"
