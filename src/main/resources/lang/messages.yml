  no-reply: "{prefix} <red>Non hai messaggi a cui rispondere."
  reply-offline: "{prefix} <red>Il giocatore non è più online."
  spy-on: "{prefix} <green>SocialSpy <white>on</white>. Vedi i privati in <gold>[SS]</gold> — anche i tuoi, finché è attivo."
  spy-off: "{prefix} <yellow>SocialSpy <white>off</white>."

fly:
  enabled: "{prefix} <green>Volo attivato."
  disabled: "{prefix} <yellow>Volo disattivato."
  enabled-for: "{prefix} <green>Volo attivato per <white>{player}</white>."
  disabled-for: "{prefix} <yellow>Volo disattivato per <white>{player}</white>."
  enabled-by: "{prefix} <gray>Il volo ti è stato attivato da <white>{player}</white>."
  disabled-by: "{prefix} <gray>Il volo ti è stato disattivato da <white>{player}</white>."
  usage: "{prefix} <gray>Uso da console: <white>/{label} <player> [on|off]</white>"

give:
  usage: "{prefix} <gray>Uso: <white>/{label} <player> <item> [quantità]</white>"
  self-usage: "{prefix} <gray>Uso: <white>/{label} <item> [quantità]</white>"
  received: "{prefix} <green>Ricevuto {item} <dark_gray>×<white>{amount}</white>."
  given: "{prefix} <green>Dato {item} <dark_gray>×<white>{amount}</white> a <white>{player}</white>."
  given-many: "{prefix} <green>Dato {item} <dark_gray>×<white>{amount}</white> a <white>{count}</white> giocatori."
  inventory-full: "{prefix} <red>Inventario di <white>{player}</white> pieno: <white>{left}</white> {item} non aggiunti (niente drop a terra)."
  too-many: "{prefix} <red>Quantità massima: <white>{max}</white>."

moderation:
  kick-usage: "{prefix} <gray>Uso: <white>/{label} <player> [motivo]</white>"
  kick-staff: "{prefix} <yellow>{player} è stato kickato. <gray>({reason})"
  # =============================================================================
  # Schermate kick/ban — plugin/ValaryRPG-Core/lang/messages.yml
  # MiniMessage. Riga vuota = spazio. Placeholder: {reason} {staff} {player} {duration} {ip} {line}
  # *-screen = Connection Lost (kick, ban permanente, o bottone Esci).
  # ban-dialog-* = countdown live (modules/moderation.yml screen.live-countdown).
  # =============================================================================
  screen-rule: "<dark_gray><st>                                        </st>"
  appeal: "<gray>Se pensi che sia ingiusto, apri un ticket su <white>discord.valaryrpg.com"
  kick-screen:
    - ""
    - "<gradient:#FB7185:#E11D48><bold>KICK</bold></gradient>"
    - "{line}"
    - ""
    - "<gray>Sei stato espulso dal server."
    - ""
    - "<white>{reason}"
    - ""
    - "<dark_gray>Staff     <gray>{staff}"
    - "{line}"
    - ""
    - "{appeal}"
    - ""
  ban-usage: "{prefix} <gray>Uso: <white>/{label} <player> [durata] [motivo]</white>"
  ban-staff: "{prefix} <red>{player} bannato per <white>{duration}</white>. <gray>({reason})"
  ban-expired: "{prefix} <green>Il ban è scaduto. Benvenuto."
  ban-dialog-title: "<gradient:#FB7185:#BE123C><bold>BANNATO</bold></gradient>"
  ban-dialog-body:
    - "<gray>Non puoi giocare su questo server."
    - ""
    - "{line}"
    - ""
    - "<dark_gray>Motivo"
    - "<white>{reason}"
    - ""
    - "<dark_gray>Tempo rimasto"
    - "<gold><bold>{duration}</bold>"
    - ""
    - "<dark_gray>Staff     <gray>{staff}"
    - "{ip-line}"
    - ""
    - "{line}"
    - ""
    - "{appeal}"
  ban-dialog-ip: "<dark_gray>IP        <gray>{ip}"
  ban-dialog-leave: "<white>Esci dal server"
  ban-screen:
    - ""
    - "<gradient:#FB7185:#BE123C><bold>BANNATO</bold></gradient>"
    - "{line}"
    - ""
    - "<gray>Non puoi entrare su questo server."
    - ""
    - "<dark_gray>Motivo"
    - "<white>{reason}"
    - ""
    - "<dark_gray>Tempo rimasto"
    - "<gold><bold>{duration}</bold>"
    - ""
    - "<dark_gray>Staff     <gray>{staff}"
    - "{line}"
    - ""
    - "{appeal}"
    - ""
  ipban-usage: "{prefix} <gray>Uso: <white>/{label} <player|ip> [durata] [motivo]</white>"
  ipban-staff: "{prefix} <red>IP <white>{ip}</white> ({target}) bannato per <white>{duration}</white>."
  ipban-screen:
    - ""
    - "<gradient:#FB7185:#BE123C><bold>IP BAN</bold></gradient>"
    - "{line}"
    - ""
    - "<gray>Questo IP non può entrare."
    - ""
    - "<dark_gray>Motivo"
    - "<white>{reason}"
    - ""
    - "<dark_gray>Tempo rimasto"
    - "<gold><bold>{duration}</bold>"
    - ""
    - "<dark_gray>IP        <gray>{ip}"
    - "{line}"
    - ""
    - "{appeal}"
    - ""
  unban-usage: "{prefix} <gray>Uso: <white>/{label} <player|ip> <motivo></white>  oppure  <white>/{label} list</white>"
  unban-staff: "{prefix} <green>Ban rimosso per <white>{player}</white>. <gray>({reason})"
  unban-ip-staff: "{prefix} <green>IP ban rimosso. <gray>Player <white>{player}</white>  IP <white>{ip}</white>. <gray>({reason})"
  unban-missing: "{prefix} <red>Nessun ban/IP-ban attivo per <white>{player}</white>."
  pardon-list-empty: "{prefix} <gray>Nessun pardon registrato."
  pardon-list-header:
    - ""
    - "<gradient:#A7F3D0:#34D399><bold>PARDON</bold></gradient>  <dark_gray>record <white>{count}"
    - ""
  pardon-list-line: "<dark_gray>› {type} <white>{player}<newline>  <gray>ban <white>{reason}<newline>  <gray>pardon <white>{revoke-reason}<newline>  <dark_gray>da <white>{revoked-by}  <dark_gray>il <white>{revoked-when}"
  banlist-empty: "{prefix} <gray>Nessun ban attivo."
  banlist-header:
    - ""
    - "<gradient:#FB7185:#BE123C><bold>BANLIST</bold></gradient>  <dark_gray>ban <white>{bans}  <dark_gray>ip <white>{ips}"
    - ""
  banlist-line: "<dark_gray>› <red>BAN</red> <white>{player}<newline>  <gray>{reason}<newline>  <dark_gray>da <white>{staff}  <dark_gray>il <white>{when}  <dark_gray>resta <gold>{duration}"
  banlist-ip-line: "<dark_gray>› <red>IPBAN</red> <white>{ip} <dark_gray>({player})<newline>  <gray>{reason}<newline>  <dark_gray>da <white>{staff}  <dark_gray>il <white>{when}  <dark_gray>resta <gold>{duration}"
