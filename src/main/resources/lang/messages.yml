  warn-target: "{prefix} <red>Hai ricevuto un warn da {staff}. <gray>{reason}"
  warn-removed: "{prefix} <green>Warn <white>#{id}</white> rimosso da <white>{player}</white>."
  warn-removed-all: "{prefix} <green>Rimossi <white>{count}</white> warn di <white>{player}</white>."
  warn-remove-missing: "{prefix} <red>Nessun warn da togliere per <white>{player}</white>."
  warn-remove-unknown: "{prefix} <red>Warn <white>#{id}</white> non trovato per <white>{player}</white>."
  warnings-usage: "{prefix} <gray>Uso: <white>/{label} <player></white>"
  warnings-empty: "{prefix} <gray>{player} non ha warn."
  warnings-header: "{prefix} <gray>Warn di {player}: <white>{count}</white>"
  warnings-line: "<dark_gray>› <white>#{id}  <gray>{reason}  <dark_gray>da <white>{staff}  <dark_gray>il <white>{when}"
  history-usage: "{prefix} <gray>Uso: <white>/{label} <player|ip></white>"
  history-empty: "{prefix} <gray>Nessuna punizione in storico per <white>{player}</white>."
  history-header:
