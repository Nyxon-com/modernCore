# =============================================================================
# Player: join/quit MiniMessage (messages.yml join-quit.*), nick, msg, fly.
# nick.blocked-words: sottostringhe case-insensitive. max-length = caratteri visibili.
# fly.persist: salva su SQL. start-flying: se persist=on, vola subito al login.
# =============================================================================

join-quit:
  enabled: true

nick:
  max-length: 32
  change-tablist: true
  blocked-words: []

msg:
  allow-self: false
  socialspy: true

fly:
  persist: true
  start-flying: true

back:
  include-death: true

heal:
  health: 20
  feed: true
  clear-effects: false

feed:
  food: 20
  saturation: 20.0
