name: ValaryRPG-Core
version: '${version}'
main: com.valaryrpg.core.ValaryCorePlugin
api-version: '1.21'
description: '${description}'
authors:
  - ValaryRPG
website: https://github.com/Nyxon-com/ValaryRPGcore
folia-supported: false
load: POSTWORLD
softdepend:
  - Vault
  - CoinsEngine
  - ExcellentEconomy
  - MMOItems
  - MythicLib
  - Multiverse-Core
  - PlaceholderAPI
libraries: []
permissions:
  valary.admin:
    description: Accesso completo alle funzioni di amministrazione
    default: op
    children:
      valary.reload: true
      valary.spawn.others: true
      valary.setspawn: true
      valary.weather.lock: true
      valary.home.unlimited: true
      valary.warp.others: true
      valary.warp.set: true
      valary.warp.delete: true
      valary.socialspy: true
      valary.nick.others: true
      valary.nick.color: true
      valary.fly.others: true
      valary.kick: true
      valary.ban: true
      valary.banlist: true
      valary.unban: true
      valary.ipban: true
      valary.mute: true
      valary.unmute: true
      valary.warn: true
      valary.warnings: true
      valary.dupeip: true
      valary.vanish: true
      valary.vanish.others: true
      valary.vanish.see: true
      valary.vanishedit: true
      valary.invsee: true
      valary.limity: true
      valary.limity.bypass: true
      valary.checkdeath.others: true
      valary.copycoord.others: true
      valary.kit.others: true
      valary.kit.bypass: true
      valary.god.others: true
      valary.heal.others: true
      valary.feed.others: true
      valary.portal: true
  valary.reload:
    description: Ricarica i file di configurazione
    default: op
  valary.spawn:
    description: Teletrasporto allo spawn del mondo
    default: true
  valary.spawn.others:
    description: Teletrasporta altri giocatori allo spawn
    default: op
  valary.setspawn:
    description: Imposta lo spawn del mondo corrente
    default: op
  valary.weather.lock:
    description: Blocca o sblocca il meteo di un mondo
    default: op
  valary.home:
    description: Usa /home e /homes
    default: true
  valary.home.set:
    description: Usa /sethome
    default: true
  valary.home.delete:
    description: Usa /delhome
    default: true
  valary.home.unlimited:
    description: Home senza limite numerico
    default: op
  valary.home.limit.default:
    description: Limite home del gruppo default
    default: true
  valary.home.limit.vip:
    description: Limite home del gruppo vip
    default: false
  valary.home.limit.mvp:
    description: Limite home del gruppo mvp
    default: false
  valary.home.limit.staff:
    description: Limite home del gruppo staff
    default: op
  valary.warp:
    description: Usa /warp e /warps
    default: true
  valary.warp.others:
    description: /warp <nomewarp> <player>
    default: op
  valary.warp.set:
    description: Usa /setwarp
    default: op
  valary.warp.delete:
    description: Usa /delwarp
    default: op
  valary.msg:
