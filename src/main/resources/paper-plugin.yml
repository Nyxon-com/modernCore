  valary.kick:
    description: Usa /kick
    default: op
  valary.ban:
    description: Usa /ban
    default: op
  valary.banlist:
    description: Usa /banlist
    default: op
  valary.unban:
    description: Usa /unban e /pardon
    default: op
  valary.ipban:
    description: Usa /ipban e /ban-ip
    default: op
  valary.mute:
    description: Usa /mute
    default: op
  valary.unmute:
    description: Usa /unmute
    default: op
  valary.warn:
    description: Usa /warn
    default: op
  valary.warnings:
    description: Usa /warnings
    default: op
  valary.history:
    description: Usa /history (ban mute warn kick)
    default: op
  valary.dupeip:
    description: Usa /dupeip
    default: op
  valary.vanish:
    description: Usa /vanish
    default: op
  valary.vanish.others:
    description: /vanish <player>
    default: op
  valary.vanish.see:
    description: Vede i giocatori in vanish
    default: op
  valary.vanishedit:
    description: Usa /vanishedit
    default: op
  valary.invsee:
    description: Usa /invsee
    default: op
  valary.limity:
    description: Usa /limity
    default: op
  valary.limity.bypass:
    description: Ignora il limite Y
    default: op
  valary.checkdeath:
    description: Usa /checkdeath
    default: true
  valary.checkdeath.others:
    description: /checkdeath <player> e restore su altri
    default: op
  valary.checkdeath.restore:
    description: /checkdeath restore
    default: op
  valary.copycoord:
    description: Usa /copycoord
