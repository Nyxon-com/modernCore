name: ValaryRPG-Core
version: '${version}'
main: com.valaryrpg.core.ValaryCorePlugin
bootstrapper: com.valaryrpg.core.ValaryBootstrap
api-version: '1.21'
description: '${description}'
authors:
  - ValaryRPG
website: https://github.com/Nyxon-com/ValaryRPGcore
folia-supported: false
dependencies:
  server:
    Multiverse-Core:
      required: false
      load: BEFORE
      join-classpath: true
    Vault:
      required: false
      load: BEFORE
      join-classpath: true
    CoinsEngine:
      required: false
      load: BEFORE
      join-classpath: true
    ExcellentEconomy:
      required: false
      load: BEFORE
      join-classpath: true
    MMOItems:
      required: false
      load: BEFORE
      join-classpath: true
    MythicLib:
      required: false
      load: BEFORE
      join-classpath: true
    VoidGen:
      required: false
      load: BEFORE
      join-classpath: true
    PlaceholderAPI:
      required: false
      load: BEFORE
      join-classpath: true
    TAB:
      required: false
      load: BEFORE
      join-classpath: false
permissions:
  valary.admin:
    description: Accesso completo alle funzioni di amministrazione
    default: op
    children:
      valary.reload: true
      valary.spawn.others: true
      valary.setspawn: true
      valary.weather.lock: true
      valary.time.lock: true
      valary.falldamage: true
      valary.home.unlimited: true
      valary.teleport.cooldown.bypass: true
      valary.warp.others: true
      valary.warp.set: true
      valary.warp.delete: true
      valary.socialspy: true
      valary.nick.others: true
      valary.nick.color: true
      valary.fly.others: true
      valary.kick: true
      valary.ban: true
      valary.banlist: true
      valary.unban: true
      valary.ipban: true
      valary.mute: true
      valary.unmute: true
      valary.warn: true
      valary.warnings: true
      valary.history: true
      valary.dupeip: true
      valary.vanish: true
      valary.vanish.others: true
      valary.vanish.see: true
      valary.vanishedit: true
      valary.invsee: true
      valary.limity: true
      valary.limity.bypass: true
      valary.checkdeath.others: true
      valary.checkdeath.restore: true
      valary.copycoord.others: true
      valary.kit.others: true
      valary.kit.bypass: true
      valary.expeditions.admin: true
      valary.god.others: true
      valary.heal.others: true
      valary.feed.others: true
      valary.give: true
      valary.portal: true
      valary.holo: true
      valary.triggerblock: true
      valary.pressureplayerjump: true
      valary.clearchat: true
      valary.chat.filter.bypass: true
      valary.chat.notify: true
      valary.playtime: true
      valary.playtime.others: true
      valary.playerlist: true
      valary.tomb: true
      valary.tomb.free: true
      valary.tomb.others: true
      valary.clearlag: true
      valary.command.see-all: true
  valary.reload:
    description: Ricarica i file di configurazione
    default: op
  valary.spawn:
    description: Teletrasporto allo spawn globale
    default: true
  valary.spawn.others:
    description: Teletrasporta altri giocatori allo spawn
    default: op
  valary.setspawn:
    description: Imposta lo spawn globale
    default: op
  valary.weather.lock:
    description: Blocca o sblocca il meteo di un mondo
    default: op
  valary.time.lock:
    description: Blocca o sblocca l'ora di un mondo
    default: op
  valary.falldamage:
    description: Attiva o disattiva il danno da caduta per mondo
    default: op
  valary.home:
    description: Usa /home e /homes
    default: true
  valary.home.set:
    description: Usa /sethome
    default: true
  valary.home.delete:
    description: Usa /delhome
    default: true
  valary.home.unlimited:
    description: Home senza limite numerico
    default: op
  valary.teleport.cooldown.bypass:
    description: Ignora il cooldown dei teleport
    default: op
  valary.home.limit.default:
    description: Limite home del gruppo default
    default: true
  valary.home.limit.vip:
    description: Limite home del gruppo vip
    default: false
  valary.home.limit.mvp:
    description: Limite home del gruppo mvp
    default: false
  valary.home.limit.staff:
    description: Limite home del gruppo staff
    default: op
  valary.warp:
    description: Usa /warp e /warps
    default: true
  valary.warp.others:
    description: /warp <nomewarp> <player>
    default: op
  valary.warp.set:
    description: Usa /setwarp
    default: op
  valary.warp.delete:
    description: Usa /delwarp
    default: op
  valary.warp.terrestre:
    description: Usa /warp terrestre (non il portale)
    default: false
  valary.warp.marte:
    description: Usa /warp marte (non il portale)
    default: false
  valary.msg:
    description: Usa /msg e /r
    default: true
  valary.socialspy:
    description: Usa /socialspy
    default: op
  valary.nick:
    description: Usa /nick
    default: false
  valary.nick.color:
