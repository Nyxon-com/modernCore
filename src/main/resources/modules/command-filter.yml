# visible = comandi del rank default (recluta).
# vip = extra per gruppo LuckPerms (i rank sopra ereditano i parent).
# disabled = nascosti/bloccati ai player. OP e valary.command.see-all vedono tutto.
# Il file usato dal server e' plugins/modernCore/modules/command-filter.yml
# (il jar non sovrascrive le liste gia' presenti).
enabled: true

# Anti-spam comandi player (ms). Bypass: valary.command.cooldown-bypass / OP see-all
cooldown-millis: 800
# Cooldown piu' lungo per aprire panel CP (anche da /cp)
panel-cooldown-millis: 1500
cooldown-exempt:
  - login
  - log
  - register
  - reg
  - totp
  - changepassword
  - changepass
  - leveling
panel-commands:
