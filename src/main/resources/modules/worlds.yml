# =============================================================================
# Mondi: spawn globale (/setspawn + /spawn), lock meteo/ora, catalogo Multiverse.
# All'avvio (e su WorldLoad) i mondi Bukkit/MV vengono scritti in `worlds:`.
# Con Multiverse-Core le config del mondo (pvp, difficulty, gamemode, hunger, fly)
# restano quelle di MV: non serve risettarle qui.
# =============================================================================

settings:
  default-world: world
  # true = join/respawn usano lo spawn del mondo in cui sei. /spawn è SEMPRE globale.
  use-current-world-spawn: false
  # true = ogni login parte dallo spawn globale (/setspawn), anche dopo un quit altrove.
  spawn-on-join: true
  spawn-on-respawn: true
  warmup-seconds: 0
  cooldown-seconds: 0
  cancel-on-move: false
  teleport-sound: true
  import-on-start: true
  ignore-prefixes:
  - arena_
  - dungeon_
  # Se Multiverse-Core è presente: non riscrivere pvp/difficulty/gamemode/hunger/fly.
  # Le config restano quelle di MV, worlds.yml viene allineato da solo.
  use-multiverse-world-config: false
  sync-worlds-from-multiverse: false
  time-lock-interval-ticks: 20
  weather-lock-client-particles: true
  weather-lock-particle: FALLING_WATER
  weather-lock-particle-count: 48

# Spawn globale: /setspawn lo scrive, /spawn ci porta da qualsiasi mondo.
# spawn: {}
# esempio dopo /setspawn:
# spawn:
#   world: cacca
#   x: 0.5
#   y: 64.0
#   z: 0.5
#   yaw: 0.0
#   pitch: 0.0

# spawn per mondo (LimitY, spawn vanilla del mondo). Se assente: World#getSpawnLocation().
spawns: {}
# esempio:
#   world:
#     x: 0.5
#     y: 64.0
#     z: 0.5
#     yaw: 0.0
#     pitch: 0.0

# lock ora. ticks: 1000 day, 6000 noon, 13000 night, 18000 midnight
time: {}
# esempio:
#   world:
#     lock: true
#     ticks: 6000

# lock meteo. type: CLEAR | RAIN | THUNDER  (sovrascrive worlds.<name>.weather)
weather: {}
# esempio:
#   world:
#     lock: true
#     type: CLEAR

# Catalogo per-mondo. Compilato all'avvio. Chiavi:
#   source              bukkit | multiverse
#   alias               nome visibile (PlaceholderAPI %valary_world_alias%)
#   environment         NORMAL | NETHER | THE_END
#   pvp / difficulty / gamemode
#   force-gamemode      true = questo mondo impone worlds.<name>.gamemode (ignora /gamemode del player)
#                       false (default) = il creative/survival del player resta anche cambiando mondo
#   spawn-monsters / spawn-animals / hunger / allow-flight
#   fall-damage         false = niente danno da caduta in quel mondo (/falldamage false <mondo>)
#   keep-spawn-in-memory / hidden / auto-heal / portal-forming
#   weather             UNSET | CLEAR | RAIN | THUNDER  (solo se weather.<mondo>.lock è assente)
#   generator / seed
worlds: {}
