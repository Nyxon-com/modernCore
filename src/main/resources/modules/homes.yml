# =============================================================================
# Home: dati posizione su SQL, qui solo limiti e comportamento.
# Il gruppo si assegna con il permesso: {permission-prefix}{group}
# Esempio: valary.home.limit.vip  ->  limits.groups.vip
# =============================================================================

settings:
  default-name: home
  max-name-length: 16
  warmup-seconds: 3
  cooldown-seconds: 5
  cancel-on-move: true

limits:
  default: 1
  permission-prefix: valary.home.limit.
  groups:
    default: 1
    kryndel: 2
    vaelorn: 3
    orynth: 4
    nymira: 5
    quirith: 6
    eldryn: 7
    volnaire: 8
    iskara: 10
    staff: -1
