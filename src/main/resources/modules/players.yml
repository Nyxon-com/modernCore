# =============================================================================
# Player: join/quit, nick (chat/tab), msg, fly e gamemode persistenti, give in inventario.
# nick.blocked-words: sottostringhe case-insensitive. max-length = caratteri visibili.
# chat.format: MiniMessage + PlaceholderAPI. {displayname} {name} {message}
# fly.persist / gamemode.persist: salva su SQL e ripristina a relog e /valary reload.
# fly.persist-death / gamemode.persist-death: dopo respawn resta fly e creative (RAM, niente SQL).
# =============================================================================

join-quit:
  enabled: true

nick:
  max-length: 32
  change-tablist: true
  change-nametag: true
  change-chat: true
  blocked-words: []

chat:
  enabled: true
  format: "%luckperms_prefix%{displayname} <dark_gray>» <reset>{message}"

msg:
  allow-self: false
  socialspy: true
  # true = anche i tuoi /msg appaiono in [SS] (utile in test a 2 account)
  spy-self: true

fly:
  persist: true
  persist-death: true
  start-flying: true

gamemode:
  persist: true
  persist-death: true

give:
  # false = l'item resta in inventario; se è pieno NON viene droppato a terra
  drop-overflow: false
  notify-target: true
  max-amount: 2304

back:
  include-death: true

heal:
  health: 20
  feed: true
  clear-effects: false

feed:
  food: 20
  saturation: 20.0
