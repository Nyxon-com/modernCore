# =============================================================================
# Utility: LimitY, hologram item a terra, morti, long-jump, portali, holo-block.
# =============================================================================
#
# LimitY: SOLO i mondi elencati sotto hanno un limite. Mondo assente = nessun LimitY.
# /limity <min> <max> scrive la sezione del mondo IN CUI SEI, non tutti i mondi.
#   commands            lista ActionCommands al superamento Y
#   notify              false = niente messaggio "sei fuori dal limite"
#   teleport-spawn      true = tp spawn mondo (default true se commands è vuoto)
#                       se lo spawn è fuori range, clamp Y su min/max (niente loop tp)
#
# Portali: cubo di BLOCCHI pos1-pos2 (inclusi). Camminare SOPRA, DENTRO o CONTRO attiva.
# xz-padding 1 = anche il blocco davanti al muro conta (nether-portal). y-padding 1 = in piedi sul pavimento.
# L'azione parte al tick successivo (i comandi in PlayerMoveEvent su Paper non partono).
# /portal wand: Destro = pos1, Shift+destro = pos2, Shift+sinistro = dest (dove sei tu).
# /portal pos1 e pos2 usano il blocco mirato, non i piedi.
# /portal command <nome> spawn            eseguito come il player (anche senza [player])
# /portal command <nome> [player] spawn
# /portal command <nome> [message] <green>ok
# /portal command <nome> [console] say {player} è entrato
#   item                assente / AIR = nessun oggetto richiesto
#   commands            eseguite all'ingresso. Destinazione opzionale se ci sono solo comandi
# portal-settings.y-padding  blocchi extra in alto (1 = resti dentro anche in piedi sul pavimento)
#
# Long-jump: solo CALPESTANDO la plate (look-trigger deve restare false).
# /pressureplayerjump set <preset> associa IL blocco mirato a un preset (non salta mirando)
#
# Hologram a terra (TextDisplay) su TUTTI gli item droppati (player, mob, blocchi, plugin).
# max-holograms: tetto simultaneo (0 = illimitato). I più vecchi vengono sostituiti.
#   font vuoto = font Minecraft normale. minecraft:uniform = testo minuscolo.
#   background ARGB: 0 = trasparente. 1073741824 = riquadro nero vanilla.
#   {name} = nome item (lang vanilla o MiniMessage custom). {amount} {seconds} {line}
#
# Holo-block: hologram su UN blocco. Click destro (o click sull'hologram) esegue i comandi.
# Shift+click = ignora (puoi piazzare / aprire chest). Wand: destro sul blocco da marcare.
# /triggerblock wand
# /triggerblock set                              marca il blocco mirato
# /triggerblock create <nome>
# /triggerblock command <nome> spawn             eseguito come il player (anche senza [player])
# /triggerblock command <nome> [player] warp pvp
# /triggerblock command <nome> [message] <green>ok
# /triggerblock command <nome> [console] say {player} ha cliccato {holo}
# /triggerblock command <nome> [console] cp crates_boss {player} pk
#   {player} e %player_name% = nome di chi clicca. PlaceholderAPI se presente.
# /triggerblock line add <nome> <gradient:#A78BFA:#EC4899>Shop</gradient>
# /triggerblock animation <nome> bob|spin|pulse|wave|none
# /triggerblock particle <nome> enchant|flame|endrod|glow|cherry|heart|none
# /triggerblock clickparticle <nome> spark|burst|magic|crit|none
# /triggerblock icon <nome>                      item in mano (mano vuota = togli)
# /triggerblock glow <nome> on|off
# /triggerblock sound <nome> holo-click          chiave in sounds.yml
# /triggerblock permission <nome> [nodo]         vuoto = tutti
# /triggerblock scale <nome> 1.2
# /triggerblock offset <nome> 1.35
# =============================================================================

limity:
  enabled: true
  notify: true
  check-interval-ticks: 20
  notify-cooldown-millis: 3000
  command-cooldown-millis: 3000
  worlds: {}

# ClearLag: elimina item a terra ogni N secondi con countdown in chat.
# /clearlag (o /clearlag now) forza la pulizia subito (permesso valary.clearlag).
clearlag:
  enabled: true
  interval-seconds: 300
  warnings: [30, 10, 5]
  worlds: []
  exclude-worlds: []
  remove-arrows: true
  remove-xp-orbs: false

ground-items:
  enabled: true
  show-name: true
  show-lore: false
  show-despawn: true
  hide-amount-when-one: true
  despawn-seconds: 300
  # Aspetta che l'item sia a terra prima di spawnare l'holo (niente holo in aria al drop).
  wait-until-grounded: true
  grounded-timeout-ticks: 100
  update-interval-ticks: 40
  scale: 0.8
  offset-y: 0.32
  font: ""
  max-lore-lines: 4
  max-holograms: 400
  vanilla-name: "<gradient:#FFE08A:#E2A84A>{name}</gradient>"
  name-format: "{name} <dark_gray>×<white>{amount}"
  name-format-one: "{name}"
  lore-format: "<gray>{line}"
  despawn-format: "<dark_gray>{seconds}s"
  background: 0
  default-background: false
  shadowed: true
  see-through: false
  line-width: 140
  text-opacity: -1
  billboard: CENTER
  alignment: CENTER

copycoord:
  decimals: 1
  range: 16

checkdeath:
  teleport: false
  restore-clear: true
  gui:
    title: "<dark_gray>Morte <white>{player}"
    rows: 6

deaths:
  enabled: true
  hide-vanilla: true
  messages:
    default: "<gray>{player} è morto <dark_gray>({cause})"
    PLAYER: "<gray>{player} è stato ucciso da <white>{killer}"
    ENTITY_ATTACK: "<gray>{player} è stato ucciso da <white>{killer}"
    FALL: "<gray>{player} è caduto da troppa altezza"
    VOID: "<gray>{player} è caduto nel vuoto"
    LAVA: "<gray>{player} è morto nella lava"
    DROWNING: "<gray>{player} è annegato"
    FIRE: "<gray>{player} è bruciato"
    FIRE_TICK: "<gray>{player} è bruciato"
    MAGIC: "<gray>{player} è morto per magia"

long-jump:
  enabled: true
  cooldown-millis: 800
  look-trigger: false
  look-required: false
  look-range: 3.5
  look-interval-ticks: 20
  sound: ENTITY_WIND_CHARGE_WIND_BURST
  plates:
    gold:
      material: LIGHT_WEIGHTED_PRESSURE_PLATE
      use-player-direction: true
      horizontal: 2.4
      vertical: 0.85
      worlds: []
    iron:
      material: HEAVY_WEIGHTED_PRESSURE_PLATE
      use-player-direction: true
      horizontal: 1.6
      vertical: 0.55
      worlds: []
  locations: {}

portal-settings:
  y-padding: 1
  xz-padding: 1
  enter-cooldown-millis: 1500

portal-wand:
  material: BLAZE_ROD
  name: "<light_purple>Wand portale"
  lore:
    - "<gray>Destro: pos1"
    - "<gray>Shift+destro: pos2"
    - "<gray>Shift+sinistro: dest"
  glow: true

portals:
  example:
    enabled: false
    world: world
    pos1:
      x: 0
      y: 64
      z: 0
    pos2:
      x: 2
      y: 66
      z: 2
    destination:
      world: world
      x: 100.5
      y: 64.0
      z: 100.5
      yaw: 0.0
      pitch: 0.0
    commands:
      - "[message] <gray>Portale example"
    item:
      material: ENDER_PEARL
      mmoitem-type: ""
      mmoitem-id: ""
      consume: true
      amount: 1
    permission: ""
    warmup-seconds: 0

holo-blocks:
  enabled: true
  max: 80
  tick-ticks: 10
  particle-every-ticks: 20
  click-cooldown-millis: 1500
  view-range: 24
  select-range: 8
  hitbox-width: 1.05
  hitbox-height: 1.8
  default-offset-y: 1.35
  default-scale: 1.0
  default-icon-scale: 0.55
  default-icon-offset-y: -0.45
  default-animation: bob
  default-particle: enchant
  default-click-particle: spark
  default-glow: false
  default-sound: holo-click
  default-lines:
    - "<gradient:#A78BFA:#EC4899><bold>{name}</bold></gradient>"
    - "<gray>Click per usare"
  wand:
    material: AMETHYST_SHARD
    name: "<light_purple>Wand hologram"
    lore:
      - "<gray>Destro: seleziona il blocco"
      - "<gray>Poi /triggerblock create <nome>"
    glow: true
  animations:
    bob:
      speed: 0.08
      height: 0.12
    spin:
      speed: 6.0
    pulse:
      speed: 0.12
      min-scale: 0.92
      max-scale: 1.08
    wave:
      speed: 0.08
      width: 0.18
      height: 0.10
  particles:
    enchant:
      type: ENCHANT
      count: 6
      offset: 0.35
      extra: 0.4
    flame:
      type: FLAME
      count: 3
      offset: 0.22
      extra: 0.01
    endrod:
      type: END_ROD
      count: 2
      offset: 0.18
      extra: 0.0
    glow:
      type: GLOW
      count: 4
      offset: 0.28
      extra: 0.0
    cherry:
      type: CHERRY_LEAVES
      count: 3
      offset: 0.30
      extra: 0.0
    heart:
      type: HEART
      count: 1
      offset: 0.20
      extra: 0.0
    portal:
      type: PORTAL
      count: 8
      offset: 0.25
      extra: 0.4
    soul:
      type: SOUL_FIRE_FLAME
      count: 3
      offset: 0.22
      extra: 0.01
  click-particles:
    spark:
      type: ELECTRIC_SPARK
      count: 12
      offset: 0.35
      extra: 0.15
    burst:
      type: FIREWORK
      count: 16
      offset: 0.40
      extra: 0.08
    magic:
      type: WITCH
      count: 14
      offset: 0.35
      extra: 0.2
    crit:
      type: CRIT
      count: 10
      offset: 0.30
      extra: 0.15
  holos:
    example:
      enabled: false
      world: world
      x: 0
      y: 64
      z: 0
      hologram:
        offset-y: 1.35
        scale: 1.0
        billboard: CENTER
        see-through: false
        line-width: 200
        background: 0
        shadowed: true
        lines:
          - "<gradient:#A78BFA:#EC4899><bold>example</bold></gradient>"
          - "<gray>Click per usare"
      animation: bob
      particle: enchant
      click-particle: spark
      glow: false
      permission: ""
      sound: holo-click
      commands:
        - "[message] <gray>Hologram example"

# Multi-hit: piu' player possono colpire lo stesso mob nello stesso momento.
# L'immunita' dopo un colpo (no-damage ticks) diventa per-player invece che globale.
# attacker-window-ticks: -1 = meta' dell'immunita' originale del mob (MythicMobs NoDamageTicks 10 -> 5 tick,
#   mob vanilla 20 -> 10 tick), cioe' un singolo player colpisce con lo stesso ritmo di prima.
multi-hit:
  enabled: true
  attacker-window-ticks: -1
