# =============================================================================
# Kit — solo starter (equip iniziale). Sinistro ritira, destro anteprima.
# =============================================================================

settings:
  first-join-kit: starter
  first-join-delay-ticks: 5
  mmoitems-give: mi give {player} {type} {id} {amount}
  right-click-preview: true
  claim-clicks:
  - LEFT
  - SHIFT_LEFT
  preview-clicks:
  - RIGHT
  - SHIFT_RIGHT
  close-on-claim: true
  drop-overflow: true
  glow-when-ready: true
  show-contents: true

gui:
  title: <b><gradient:#E5A2C1:#9711EA>ᴋɪᴛ</gradient></b> <gray>{player}
  rows: 3
  open-sound: BLOCK_CHEST_OPEN
  fill:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: <black>
    lore: []
    hide-flags: true
  frame:
    enabled: true
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: <black>
      hide-flags: true
    accents:
      material: MAGENTA_STAINED_GLASS_PANE
      name: <black>
      hide-flags: true
    edges:
      material: GRAY_STAINED_GLASS_PANE
      name: <black>
      hide-flags: true
  slots:
    '4':
      action: none
      material: NETHER_STAR
      name: <b><gradient:#E5A2C1:#9711EA>ꜱᴛᴀʀᴛᴇʀ</gradient></b>
      lore:
      - <gray>Equip iniziale di Valary
      - <dark_gray>Sinistro ritira · destro anteprima
      - <white>1 volta al giorno
      hide-flags: true
      glow: true
    '13':
      action: kit
      kit: starter
      material: CHEST
      mmoitem-type: SWORD
      mmoitem-id: SPADA_INIZIALE
      name: <b><gradient:#FFF6C2:#E8A317>ᴋɪᴛ ꜱᴛᴀʀᴛᴇʀ</gradient></b>
      lore:
      - <gray>Elmo, corazza, gambali, stivali
      - <gray>Spada e piccone iniziale
      - <white>Tutti i player · 24h
      glow: true
      click-sound: ENTITY_EXPERIENCE_ORB_PICKUP
      commands: []
    '22':
      action: close
      material: BARRIER
      name: <red><bold>Chiudi</bold>
      hide-flags: true
      commands:
      - '[close]'

preview:
  title: <b><gradient:#E5A2C1:#9711EA>ᴀɴᴛᴇᴘʀɪᴍᴀ</gradient></b> <gray>{kit}
  rows: 3
  content-slots: 11-15
  close-slot: 22
  fill:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: <black>
  frame:
    enabled: true
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: <black>
      hide-flags: true
    accents:
      material: MAGENTA_STAINED_GLASS_PANE
      name: <black>
      hide-flags: true
    edges:
      material: GRAY_STAINED_GLASS_PANE
      name: <black>
      hide-flags: true
  close:
    material: ARROW
    name: <gray>Indietro
    hide-flags: true
    commands: []
  claim-slot: 18
  claim:
    material: LIME_DYE
    name: <gradient:#7CFF4A:#22C55E><bold>Ritira</bold></gradient>
    lore:
    - <gray>Prendi il kit starter
    hide-flags: true
    commands: []

kits:
  starter:
    cooldown-seconds: 86400
    permission: ''
    first-join: true
    one-time: false
    items:
    - mmoitem-type: ARMOR
      mmoitem-id: ELMETTO_INIZIALE
      amount: 1
    - mmoitem-type: ARMOR
      mmoitem-id: CORPETTO_INIZIALE
      amount: 1
    - mmoitem-type: ARMOR
      mmoitem-id: GAMBALI_INIZIALE
      amount: 1
    - mmoitem-type: ARMOR
      mmoitem-id: STIVALI_INIZIALE
      amount: 1
    - mmoitem-type: SWORD
      mmoitem-id: SPADA_INIZIALE
      amount: 1
    - mmoitem-type: TOOL
      mmoitem-id: PICCONE_INIZIALE
      amount: 1
    commands: []
