# =============================================================================
# Kit — starter (equip iniziale) + kit giornalieri VIP. Sinistro ritira, destro anteprima.
# Kit VIP: permesso group.<rank>; i rank superiori ereditano i precedenti
# e possono ritirare tutti i kit dei rank sotto (cumulativo).
# =============================================================================

settings:
  first-join-kit: starter
  first-join-delay-ticks: 5
  mmoitems-give: mi give {player} {type} {id} {amount}
  right-click-preview: true
  claim-clicks:
  - LEFT
  - SHIFT_LEFT
  preview-clicks:
  - RIGHT
  - SHIFT_RIGHT
  close-on-claim: true
  drop-overflow: true
  glow-when-ready: true
  show-contents: true

gui:
