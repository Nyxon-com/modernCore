# =============================================================================
# Kit — dati ricompensa + GUI stile CommandPanels
# =============================================================================
#
# GUI (sezione gui):
#   title          MiniMessage. Placeholder: {player}
#   rows           1-6
#   open-sound     suono Bukkit (es. UI_BUTTON_CLICK) o vuoto
#   fill           item che riempie gli slot VUOTI interni (stessi campi di uno slot)
#   frame          cornice: corners / accents (accanto agli angoli) / edges
#   slots          mappa slot -> bottone. Chiavi: "11" oppure "18-26" oppure "0,8,17"
#
# Campi di uno slot:
#   action              kit | preview | page | close | command | none
#   kit                 id del kit. action: kit → sinistro ritira, destro anteprima
#                       action: preview → anteprima su qualsiasi click (opzionale)
#   page                numero pagina (solo action: page)
#   one-time            sul kit: true = ritirabile una sola volta (SQL kit_claims)
#
# Pagine extra sotto gui.pages.<n> (stessi campi di gui: title, rows, slots).
# Il fill della pagina 1 viene riusato. preview: GUI contenuto (si apre col destro sul kit).
#   material            materiale vanilla (IRON_SWORD). Fallback se MMOItems assente
#   mmoitem-type        tipo MMOItems (SWORD, CONSUMABLE, ARMOR, ...)
#   mmoitem-id          id interno MMOItems (es. STEEL_SWORD)
#   name / lore         MiniMessage. {player} = chi apre
#   amount              1-64
#   custom-model-data   0 = disattivo
#   glow / enchanted    glow finto
#   hide-flags          nasconde attributi/enchants
#   skull-owner         nick per PLAYER_HEAD
#   click-sound         suono al click
#   commands            lista click extra:
#     - "[close]"
#     - "[console] say {player} ha preso un kit"
#     - "[player] warp spawn"
#     - "[sound] UI_BUTTON_CLICK"
#     - "[message] <green>Fatto"
#
# Kit (sezione kits.<id>): contenuto dato al claim, NON il layout GUI.
#   cooldown-seconds    0 = nessuno. Persistito su SQL
#   permission          vuoto = tutti. Es. valary.kit.daily
#   first-join          true = candidabile come kit welcome (vedi settings)
#   one-time            true = una sola volta (bypass: valary.kit.bypass)
#   items               lista:
#     - material: BREAD
#       amount: 16
#     - mmoitem-type: SWORD
#       mmoitem-id: STARTER_BLADE
#       amount: 1
#   commands            eseguiti da console al claim. {player} = nick
#
# settings.mmoitems-give  comando se getItem() reflection fallisce
# settings.right-click-preview  true = destro apre l'anteprima (niente bottone a parte)
# settings.close-on-claim       chiude la GUI dopo il ritiro
# settings.drop-overflow        zaino pieno → droppa a terra
# =============================================================================

settings:
  first-join-kit: starter
  first-join-delay-ticks: 20
  mmoitems-give: "mi give {player} {type} {id} {amount}"
  right-click-preview: true
  close-on-claim: true
  drop-overflow: true

gui:
  title: "<dark_gray>Kit <white>{player}"
  rows: 3
  open-sound: UI_BUTTON_CLICK
  fill:
    enabled: false
    material: GRAY_STAINED_GLASS_PANE
    name: "<black>"
    lore: []
  frame:
    enabled: true
    corners:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: "<black>"
      hide-flags: true
    accents:
      material: BLUE_STAINED_GLASS_PANE
      name: "<black>"
      hide-flags: true
    edges:
      material: GRAY_STAINED_GLASS_PANE
      name: "<black>"
      hide-flags: true
  slots:
    11:
      action: kit
      kit: starter
      material: IRON_SWORD
      # mmoitem-type: SWORD
      # mmoitem-id: STARTER_BLADE
      name: "<green>Starter"
      lore:
        - "<gray>Kit di benvenuto"
      glow: false
      click-sound: ENTITY_EXPERIENCE_ORB_PICKUP
      commands: []
    13:
      action: kit
      kit: daily
      material: GOLD_INGOT
      name: "<gold>Daily"
      lore:
        - "<gray>Ricompensa giornaliera"
      commands: []
    16:
      action: page
      page: 2
      material: ARROW
      name: "<gray>Avanti"
      hide-flags: true
      commands: []
    22:
      action: close
      material: BARRIER
      name: "<red>Chiudi"
      hide-flags: true
      commands:
        - "[close]"
  pages:
    2:
      title: "<dark_gray>Kit <white>{player} <gray>p.2"
      rows: 3
      slots:
        11:
          action: page
          page: 1
          material: ARROW
          name: "<gray>Indietro"
          hide-flags: true
          commands: []
        22:
          action: close
          material: BARRIER
          name: "<red>Chiudi"
          hide-flags: true
          commands:
            - "[close]"

preview:
  title: "<dark_gray>Anteprima <white>{kit}"
  rows: 6
  content-slots: "10-16,19-25,28-34,37-43"
  close-slot: 49
  fill:
    enabled: false
    material: GRAY_STAINED_GLASS_PANE
    name: "<black>"
  frame:
    enabled: true
    corners:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: "<black>"
      hide-flags: true
    accents:
      material: BLUE_STAINED_GLASS_PANE
      name: "<black>"
      hide-flags: true
    edges:
      material: GRAY_STAINED_GLASS_PANE
      name: "<black>"
      hide-flags: true
  close:
    material: ARROW
    name: "<gray>Indietro"
    hide-flags: true
    commands: []

kits:
  starter:
    cooldown-seconds: 86400
    permission: ""
    first-join: true
    one-time: false
    items:
      - material: BREAD
        amount: 16
        name: "<gold>Pane starter"
      - material: WOODEN_SWORD
        amount: 1
        name: "<white>Spada starter"
      # - mmoitem-type: SWORD
      #   mmoitem-id: STARTER_BLADE
      #   amount: 1
    commands: []
    # - "eco give {player} 50"
  daily:
    cooldown-seconds: 86400
    permission: valary.kit.daily
    first-join: false
    one-time: false
    items:
      - material: COOKED_BEEF
        amount: 8
        name: "<gold>Razione daily"
    commands: []
