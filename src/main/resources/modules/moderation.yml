# =============================================================================
# Moderazione nativa. kick/ban/ban-ip/banlist/pardon sostituiscono i vanilla.
# Durate ban/mute: 10s 5m 2h 7d 2w 1mo 1y  perm  permanent  -1
# =============================================================================

kick:
  default-reason: Kicked from the server
ban:
  default-reason: Banned from the server
ipban:
  default-reason: IP banned
mute:
  default-reason: Muted
  # Label comando senza slash e senza namespace (msg, non minecraft:msg)
  blocked-commands:
    - msg
    - tell
    - w
    - r
    - reply
    - whisper
    - m
    - me
warn:
  default-reason: Warning
  max-listed: 10
history:
  max-listed: 25
vanish:
  hide-from-tab: true
  fake-join-quit: true
  night-vision: true
  no-pickup: true
  silent-join: true

# Schermata ban. instant true = kick subito (Connection Lost). live-countdown è solo se instant è false.
screen:
  instant: true
  live-countdown: false
  tick-ticks: 20
  dialog-width: 320
  hide-from-tab: true
  gamemode: SPECTATOR
  leave-click: valaryrpg:ban-leave

# /invsee layout. Title MiniMessage, {player} = target.
# contents-start: i 36 slot inventario (hotbar 0-8 + zaino) partono da qui.
invsee:
  gui:
    title: "<dark_gray>Invsee <white>{player}"
    rows: 6
    slots:
      helmet: 0
      chestplate: 1
      leggings: 2
      boots: 3
      offhand: 4
      contents-start: 9
    filler:
      slots: "5-8"
      material: GRAY_STAINED_GLASS_PANE
      name: "<black>"
      lore: []
      glow: false

# /vanishedit — menu flag, NON toglie il vanish.
vanishedit:
  gui:
    title: "<dark_gray>Vanish <white>edit"
    rows: 3
    open-sound: UI_BUTTON_CLICK
    fill:
      enabled: false
      material: GRAY_STAINED_GLASS_PANE
      name: "<black>"
    frame:
      enabled: true
      corners:
        material: LIGHT_BLUE_STAINED_GLASS_PANE
        name: "<black>"
        hide-flags: true
      accents:
        material: BLUE_STAINED_GLASS_PANE
        name: "<black>"
        hide-flags: true
      edges:
        material: GRAY_STAINED_GLASS_PANE
        name: "<black>"
        hide-flags: true
    slots:
      11:
        action: nightvision
        material: ENDER_EYE
        name: "<aqua>Night vision"
        lore:
          - "<gray>Click per accendere/spegnere"
        hide-flags: true
      15:
        action: pickup
        material: HOPPER
        name: "<gold>No pickup"
        lore:
          - "<gray>Click per accendere/spegnere"
        hide-flags: true
