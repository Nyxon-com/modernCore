# =============================================================================
# Moderazione nativa. kick/ban/ban-ip/banlist/pardon sostituiscono i vanilla.
# Durate ban/mute: 10s 5m 2h 7d 2w 1mo 1y  perm  permanent  -1
# =============================================================================

kick:
  default-reason: Kicked from the server
ban:
  default-reason: Banned from the server
ipban:
  default-reason: IP banned
mute:
  default-reason: Muted
  # Label comando senza slash e senza namespace (msg, non minecraft:msg)
  blocked-commands:
    - msg
    - tell
    - w
    - r
    - reply
    - whisper
    - m
    - me
warn:
  default-reason: Warning
  max-listed: 10
history:
  max-listed: 25
vanish:
  hide-from-tab: true
  fake-join-quit: false
  night-vision: true
  no-pickup: true
  silent-join: true

# Schermata ban. Connection Lost vanilla NON può aggiornare il tempo: è un frame fisso.
# live-countdown true = dialog nativo Minecraft (1.21.6+) col countdown che scende ogni secondo.
# Testi/colori/spazi: lang/messages.yml → moderation.ban-dialog-* e moderation.*-screen
screen:
  live-countdown: true
  tick-ticks: 20
  dialog-width: 320
  hide-from-tab: true
  gamemode: SPECTATOR
  leave-click: valaryrpg:ban-leave

# /invsee layout. Title MiniMessage, {player} = target.
# contents-start: i 36 slot inventario (hotbar 0-8 + zaino) partono da qui.
invsee:
  gui:
    title: "<dark_gray>Invsee <white>{player}"
    rows: 6
    slots:
      helmet: 0
      chestplate: 1
      leggings: 2
      boots: 3
      offhand: 4
      contents-start: 9
    filler:
      slots: "5-8"
      material: GRAY_STAINED_GLASS_PANE
      name: "<black>"
      lore: []
      glow: false
