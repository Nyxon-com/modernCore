# =============================================================================
# Messaggi (MiniMessage + HEX). Placeholder: {prefix} {player} {world} {error}
# {target} {weather} {x} {y} {z}
# =============================================================================

general:
  no-permission: "{prefix} <red>Non hai il permesso per eseguire questo comando."
  player-only: "{prefix} <red>Questo comando può essere usato solo da un giocatore."
  player-not-found: "{prefix} <red>Giocatore <white>{target}</white> non trovato o non online."
  invalid-world: "{prefix} <red>Il mondo <white>{world}</white> non è caricato."
  module-disabled: "{prefix} <red>Il modulo <white>{module}</white> è disabilitato."
  unknown-subcommand: "{prefix} <gray>Uso: <white>/{label} reload</white>"
  cooldown: "{prefix} <red>Attendi un attimo prima di riusare il comando."

reload:
  success: "{prefix} <green>Configurazione ricaricata correttamente."
  failed: "{prefix} <red>Reload fallito. Controlla la console. <gray>({error})"

spawn:
  teleported: "{prefix} <gray>Sei stato teletrasportato allo spawn di <white>{world}</white>."
  teleported-other: "{prefix} <gray>Hai teletrasportato <white>{target}</white> allo spawn di <white>{world}</white>."
  teleported-by-staff: "{prefix} <gray>Sei stato teletrasportato allo spawn da <white>{player}</white>."
  not-set: "{prefix} <yellow>Spawn non configurato per <white>{world}</white><yellow>, uso lo spawn di default del mondo."
  set: "{prefix} <green>Spawn di <white>{world}</white> impostato a <white>{x}</white>, <white>{y}</white>, <white>{z}</white>."
  warmup: "{prefix} <gray>Teletrasporto tra <white>{seconds}</white>s. Non muoverti."
  cancelled-move: "{prefix} <red>Teletrasporto annullato: ti sei mosso."

teleport:
  warmup: "{prefix} <gray>Teletrasporto tra <white>{seconds}</white>s. Non muoverti."
  cancelled-move: "{prefix} <red>Teletrasporto annullato: ti sei mosso."

homes:
  set: "{prefix} <green>Home <white>{home}</white> impostata in <white>{world}</white> <gray>({x}, {y}, {z})."
  teleported: "{prefix} <gray>Sei arrivato alla home <white>{home}</white>."
  deleted: "{prefix} <green>Home <white>{home}</white> eliminata."
  not-found: "{prefix} <red>Non hai una home chiamata <white>{home}</white>."
  invalid-name: "{prefix} <red>Nome home non valido. Usa lettere, numeri e underscore."
  limit-reached: "{prefix} <red>Hai raggiunto il limite di <white>{limit}</white> home."
  list: "{prefix} <gray>Home ({count}): <white>{homes}</white>"
  list-empty: "{prefix} <gray>Non hai ancora nessuna home. Usa <white>/sethome</white>."

warps:
  usage: "{prefix} <gray>Uso: <white>/{label} <nomewarp></white> oppure <white>/{label} <nomewarp> <player></white>"
  usage-console: "{prefix} <gray>Uso da console: <white>/{label} <nomewarp> <player></white>"
  set-usage: "{prefix} <gray>Uso: <white>/{label} <nome></white>"
  del-usage: "{prefix} <gray>Uso: <white>/{label} <nome></white>"
  set: "{prefix} <green>Warp <white>{warp}</white> impostato in <white>{world}</white>."
  teleported: "{prefix} <gray>Sei arrivato al warp <white>{warp}</white>."
  teleported-other: "{prefix} <gray>Hai teletrasportato <white>{target}</white> al warp <white>{warp}</white>."
  teleported-by-staff: "{prefix} <gray>Sei stato portato al warp <white>{warp}</white> da <white>{player}</white>."
  deleted: "{prefix} <green>Warp <white>{warp}</white> eliminato."
  not-found: "{prefix} <red>Il warp <white>{warp}</white> non esiste."
  invalid-name: "{prefix} <red>Nome warp non valido. Usa lettere, numeri e underscore."
  list: "{prefix} <gray>Warp ({count}): <white>{warps}</white>"
  list-empty: "{prefix} <gray>Nessun warp configurato. Usa <white>/setwarp</white>."

weather:
  locked: "{prefix} <green>Meteo di <white>{world}</white> bloccato su <white>{weather}</white>."
  unlocked: "{prefix} <green>Meteo di <white>{world}</white> sbloccato."
  usage: "{prefix} <gray>Uso: <white>/{label} <clear|rain|thunder|unlock> [mondo]</white>"
  invalid-type: "{prefix} <red>Tipo meteo non valido. Usa: clear, rain, thunder, unlock."

join-quit:
  join: "<dark_gray>[<green>+<dark_gray>] <gray>{displayname}"
  first-join: "<dark_gray>[<gold>+<dark_gray>] <yellow>{displayname} <gray>è entrato per la prima volta."
  quit: "<dark_gray>[<red>-<dark_gray>] <gray>{displayname}"

nick:
  current: "{prefix} <gray>Nickname attuale: {nick}"
  none: "{prefix} <gray>Non hai un nickname. Usa <white>/nick <nome></white>."
  set: "{prefix} <green>Nickname di <white>{player}</white> impostato a {nick}<green>."
  set-by-staff: "{prefix} <gray>{player} ti ha impostato il nickname {nick}<gray>."
  cleared: "{prefix} <green>Nickname di <white>{player}</white> rimosso."
  cleared-by-staff: "{prefix} <gray>{player} ti ha rimosso il nickname."
  invalid: "{prefix} <red>Nickname non valido."
  too-long: "{prefix} <red>Nickname troppo lungo (max {max} caratteri visibili)."
  blocked: "{prefix} <red>Questo nickname contiene parole non permesse."

msg:
  usage: "{prefix} <gray>Uso: <white>/{label} <player> <messaggio></white>"
  reply-usage: "{prefix} <gray>Uso: <white>/{label} <messaggio></white>"
  to-sender: "<gray>[<white>Tu <dark_gray>→ <white>{target}<gray>] <white>{message}"
  to-target: "<gray>[<white>{player} <dark_gray>→ <white>Te<gray>] <white>{message}"
  spy: "<dark_gray>[SS] <gray>{player} <dark_gray>→ <gray>{target}<dark_gray>: <white>{message}"
  self: "{prefix} <red>Non puoi scriverti da solo."
  no-reply: "{prefix} <red>Non hai messaggi a cui rispondere."
  reply-offline: "{prefix} <red>Il giocatore non è più online."
  spy-on: "{prefix} <green>SocialSpy attivato."
  spy-off: "{prefix} <yellow>SocialSpy disattivato."

fly:
  enabled: "{prefix} <green>Volo attivato."
  disabled: "{prefix} <yellow>Volo disattivato."
  enabled-for: "{prefix} <green>Volo attivato per <white>{player}</white>."
  disabled-for: "{prefix} <yellow>Volo disattivato per <white>{player}</white>."
  enabled-by: "{prefix} <gray>Il volo ti è stato attivato da <white>{player}</white>."
  disabled-by: "{prefix} <gray>Il volo ti è stato disattivato da <white>{player}</white>."
  usage: "{prefix} <gray>Uso da console: <white>/{label} <player> [on|off]</white>"
