# =============================================================================
# Warp di server (non per-player). I punti stanno in questo file, non su SQL.
# /setwarp <nome> salva world/x/y/z/yaw/pitch. Nomi: lettere numeri underscore.
# /warp <nome> [player] — il secondo argomento è il NICK, non @p/@a.
# =============================================================================

settings:
  max-name-length: 16
  warmup-seconds: 3
  cancel-on-move: true

warps: {}
# esempio:
#   spawnshop:
#     world: world
#     x: 0.5
#     y: 64.0
#     z: 0.5
#     yaw: 0.0
#     pitch: 0.0
